version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: fuzz_user
      POSTGRES_PASSWORD: fuzz_password
      POSTGRES_DB: fuzz_sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuzz_user -d fuzz_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fuzz_user:fuzz_password@db:5432/fuzz_sentinel
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
